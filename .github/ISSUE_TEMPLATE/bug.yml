name: 🐛 버그 리포트
description: 스크립트, 문서, 설정에서 재현되는 문제를 신고합니다.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        보고 전 [troubleshooting](../docs/troubleshooting.md) 을 먼저 확인해주세요.

  - type: input
    id: pi-model
    attributes:
      label: Pi 모델 / RAM
      placeholder: "예: Raspberry Pi 5 8GB"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS / 커널
      description: "`uname -a` 결과를 그대로 붙여넣으세요."
      placeholder: "예: Linux pi 6.6.31+rpt-rpi-2712 #1 SMP PREEMPT ..."
    validations:
      required: true

  - type: input
    id: claude-version
    attributes:
      label: Claude Code 버전
      description: "`claude --version` 결과"
    validations:
      required: true

  - type: input
    id: openclaw-version
    attributes:
      label: OpenClaw 버전
    validations:
      required: false

  - type: textarea
    id: repro
    attributes:
      label: 재현 절차
      description: 명령어 / 입력 / 기대 결과 / 실제 결과
      render: bash
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 로그 / 에러 메시지
      description: 민감 정보는 마스킹 후 첨부.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: 확인
      options:
        - label: "토큰·자격증명을 본 이슈에 포함하지 않았습니다."
          required: true
        - label: "최신 main 브랜치에서 재현됩니다."
          required: false
