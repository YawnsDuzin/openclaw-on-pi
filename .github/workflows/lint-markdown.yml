name: lint-markdown

on:
  push:
    branches: [main, dev]
    paths:
      - "**/*.md"
      - ".github/workflows/lint-markdown.yml"
      - ".markdownlint.jsonc"
  pull_request:
    paths:
      - "**/*.md"
      - ".github/workflows/lint-markdown.yml"
      - ".markdownlint.jsonc"

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            **/*.md
            !node_modules
            !_docs
