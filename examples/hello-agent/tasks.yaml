# OpenClaw task 정의 — hello-agent
#
# 가장 작은 단위 작업: README.md 끝에 한 줄 추가하고 새 커밋을 만든다.
# 이 task 가 성공하면 OpenClaw ↔ Claude Code 파이프라인이
# 끝에서 끝까지 동작한다는 뜻이다.
#
# 본 파일의 키 이름은 OpenClaw 본 저장소의 스키마와 다를 수 있다.
# 차이가 있으면 이 파일을 갱신하라.

- name: hello-write
  queue: default
  workdir: .                       # `cd examples/hello-agent` 후 실행 가정
  prompt: |
    이 디렉토리의 README.md 파일 끝에 한 줄을 추가하라.
    추가할 줄: "OpenClaw says hi at <UTC ISO-8601 timestamp>"

    그 다음:
      1) git add README.md
      2) git commit -m "chore(hello): hello-agent demo run"

    제약:
      - README.md 외 다른 파일은 만지지 말 것
      - 커밋은 정확히 1개만 생성
      - 새 브랜치를 만들지 말 것 (현재 브랜치에 직접)

  # 작업 결과 검증 — OpenClaw 가 task 종료 후 실행하는 셸 명령.
  # exit 0 이면 success, 아니면 fail.
  verify: |
    set -euo pipefail
    git log -1 --pretty=%s | grep -q "^chore(hello): hello-agent demo run$"
    git show --stat HEAD | grep -q "README.md"
    grep -q "OpenClaw says hi at " README.md
